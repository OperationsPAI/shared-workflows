name: Shared Helm Publish

on:
  workflow_call:
    inputs:
      main-branch:
        description: "The main branch to check if the tag commit is an ancestor of"
        type: string
        required: false
        default: "main"
      chart-dir:
        type: string
        default: "helm"
      repo-name:
        type: string
        required: true
      repo-url:
        type: string
        required: true

jobs:
  deploy:
    name: Deploy to gh-pages
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SEMVER_REGEX: "v[0-9]+.[0-9]+.[0-9]+*"

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4.3.0
      with:
        version: 'v3.16.3'

    - name: Run publish script
      env:
        CHART_DIR: ${{ inputs.chart-dir }}
        REPO_NAME: ${{ inputs.repo-name }}
        REPO_URL: ${{ inputs.repo-url }}
      run: |
        set -e
        helm dependency update $CHART_DIR
          
        mkdir -p .deploy
        helm package $CHART_DIR -d .deploy

        curl -f -o .deploy/index.yaml "${REPO_URL}index.yaml" || echo "No existing index.yaml found"

        cd .deploy
        if [ -f index.yaml ]; then
            helm repo index . --url $REPO_URL --merge index.yaml
        else
            helm repo index . --url $REPO_URL
        fi

    - name: Publish to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: .deploy
        publish_branch: gh-pages
        force_orphan: true